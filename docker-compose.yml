version: '3.8'

services:
  mongodb:
    image: mongodb/mongodb-community-server:latest
    container_name: pipeline-mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
    volumes:
      - mongodb_data:/data/db

  infra-gateway-ui:
    build:
      context: ./infra-gateway/ui
      dockerfile: Dockerfile
    container_name: pipeline-infra-gateway-ui
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      MONGODB_URI: mongodb://root:example@mongodb:27017/pipeline_management?authSource=admin
    depends_on:
      - mongodb

volumes:
  mongodb_data:
